spring.application.name=map_shortest_path_finder

# Load local settings and secrets (GEMINI_API_KEY, INTENT_LLM_PROVIDER, ...) from ".env" in the working directory
# (the project root when started with ./mvnw spring-boot:run). "optional:" = no error if the file does not exist.
# Real environment variables take precedence over the file. See .env.example.
spring.config.import=optional:file:.env[.properties]

# ─── Database ─────────────────────────────────────────────────────────────────
# Matches the credentials in docker-compose.yml.
# The app requires Docker to be running: `docker compose up -d`
spring.datasource.url=jdbc:postgresql://localhost:5433/mapdb
spring.datasource.username=postgres
spring.datasource.password=password


# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# update = creates missing tables automatically, never drops existing data.
# Switch to 'validate' once the schema is stable and you want Hibernate to
# catch mismatches instead of silently patching them.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Batch inserts: instead of N individual INSERTs, Hibernate groups them into
# batches of 500. Critical for the graph import (potentially 10k+ rows).
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# ─── Region ───────────────────────────────────────────────────────────────────
# Multi-city: Vijayawada - Rajahmundry - Visakhapatnam (Andhra Pradesh, India).
#   * region.bbox covers the whole corridor; routes may start/end anywhere inside it.
#   * corridor: only major roads over the whole bbox, so city-to-city routes exist without importing every village track.
#   * areas: each city's urban core imported with FULL street-level detail.
# Needs a bigger heap: export JAVA_TOOL_OPTIONS=-Xmx2g  (see README). Import is resumable and takes a while on Overpass;
# with a local extract it is much faster (region.importer.source=pbf below).
# Single-city setup (Rajahmundry only) for comparison / reverting: delete the corridor + areas lines and use
#   region.name=Rajahmundry  bbox south=16.96 north=17.01 west=81.76 east=81.82  (and region.max-snap-meters=0)
region.name=Vijayawada-Visakhapatnam
region.bbox.south=16.45
region.bbox.north=17.80
region.bbox.west=80.55
region.bbox.east=83.35
# A clicked point farther than this from any imported road is refused (the bbox now contains sea and countryside).
region.max-snap-meters=500

region.corridor.highway-filter=^(motorway|trunk|primary|secondary|tertiary)(_link)?$
region.corridor.tile-size-degrees=0.5

region.areas[0].name=Vijayawada
region.areas[0].bbox.south=16.47
region.areas[0].bbox.north=16.56
region.areas[0].bbox.west=80.59
region.areas[0].bbox.east=80.69

region.areas[1].name=Rajahmundry
region.areas[1].bbox.south=16.96
region.areas[1].bbox.north=17.01
region.areas[1].bbox.west=81.76
region.areas[1].bbox.east=81.82

region.areas[2].name=Visakhapatnam
region.areas[2].bbox.south=17.68
region.areas[2].bbox.north=17.77
region.areas[2].bbox.west=83.19
region.areas[2].bbox.east=83.33

# ─── Import source ────────────────────────────────────────────────────────────
# Where the import (profile "import") reads OpenStreetMap data from:
#   overpass (default)  the public Overpass API, rotating through region.importer.urls on failures
#   pbf                 a local .osm.pbf extract (e.g. from https://download.geofabrik.de) — no network, no 504s
# For pbf, clip the download to the region first, e.g.
#   osmium extract -b 80.55,16.45,83.35,17.80 india-latest.osm.pbf -o data/region.osm.pbf
region.importer.source=${IMPORT_SOURCE:overpass}
region.importer.pbf-path=${IMPORT_PBF_PATH:data/region.osm.pbf}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.sashank=INFO
# ─── Intent-based routing: LLM provider (Spring AI) ───────────────────────────
# Pick the provider with an environment variable; the key comes from the environment too.
#   export INTENT_LLM_PROVIDER=google-genai   (Gemini; or: anthropic (default) | openai | none)
#   export GEMINI_API_KEY=...                 (or ANTHROPIC_API_KEY / OPENAI_API_KEY for those providers)
# With no key the app still starts on the default provider; the intent endpoints answer 503 until one is set.
# NOTE: INTENT_LLM_PROVIDER=openai or google-genai with no key fails at startup (Spring AI validates it), which is
# why neither is the default. The value must be exactly "google-genai" ("gemini" is silently ignored).
spring.ai.model.chat=${INTENT_LLM_PROVIDER:anthropic}
# We only use chat; keep Spring AI from configuring (and demanding keys for) anything else.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=${INTENT_LLM_MODEL:claude-haiku-4-5-20251001}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# Gemini (Google AI Studio key). GOOGLE_API_KEY is accepted as an alternative name for the same key.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
spring.ai.openai.chat.model=${INTENT_LLM_MODEL:gpt-4o-mini}
# Check Google's current model list and override with INTENT_LLM_MODEL if this name has been retired.
spring.ai.google.genai.chat.model=${INTENT_LLM_MODEL:gemini-2.5-flash}

# Deterministic, short output; bounded waiting. A request must not hang on a slow provider.
spring.ai.anthropic.chat.temperature=0.0
spring.ai.anthropic.chat.max-tokens=500
spring.ai.anthropic.timeout=15s
spring.ai.anthropic.max-retries=1
# Gemini: ask for JSON directly; the generous token cap leaves room for "thinking" tokens on reasoning models, which
# count against it. Spring AI exposes no timeout for Gemini — intent.llm-timeout-seconds below covers it.
spring.ai.google.genai.chat.temperature=0.0
spring.ai.google.genai.chat.max-output-tokens=2048
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.openai.chat.temperature=0.0
spring.ai.openai.chat.max-completion-tokens=500
spring.ai.openai.timeout=15s
spring.ai.openai.max-retries=1
# Spring AI's own retry policy defaults to 10 attempts with exponential backoff (minutes!).
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=2s
spring.ai.retry.on-client-errors=false

intent.max-query-length=500
# Hard cap on a single LLM call, whatever the provider.
intent.llm-timeout-seconds=30
