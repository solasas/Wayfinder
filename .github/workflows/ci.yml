name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers (SnapServiceIntegrationTest, GraphServiceIntegrationTest)
      # talks straight to the Docker daemon already running on this runner —
      # no extra setup needed, and no port/platform quirks here since
      # ubuntu-latest is amd64, matching the postgis/postgis image natively.
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test
